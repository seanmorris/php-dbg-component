PRODUCT_NAME: php-dbg-component
TITLE_PREFIX: php-dbg-component
TAGLINE: Embed a PHP debugger in your page
BASE_URL: ''
OUTPUT_DIR: ../docs

DEFAULT_THEME: theme-dbg
PAGES_DIR: ./pages
TEMPLATE_DIR: ./templates
STATIC_DIR: ./static
SMGEN_ENGINE: php
SEARCH_ENABLED: 0
INHERIT_CORE_STATIC: 0
HIGHLIGHT_STYLE: kate
DOCS_VERSION: v0.1.0
DOCS_REPOSITORY: https://github.com/seanmorris/php-dbg-component
CORE_ASSETS:
  - main.js
  - nav-state.js
  - scrollbar.css
SCRIPTS:
  - /theme.js
  - /nav-state.js
DEFER_SCRIPTS:
  - /main.js
STYLES:
  - /scrollbar.css
  - /assets/component/styles.css
  - /site.css
MENUS:
  docs:
    label: Contents
    renderer: tree
    hierarchy: source
    showLabel: false
MENU_REGIONS:
  sidebar: [docs]

# /llms.txt, the index of these pages for language models. A page joins a section with "llms" in
# its frontmatter.
LLMS:
  summary: >-
    A vanilla JavaScript PHP debugger to embed in a web page or drive from a script. PHP 8.0 to
    8.5, compiled to WebAssembly, runs in the reader's browser.
  details: |
    The component is installed from GitHub until its first npm release:
    `npm install github:seanmorris/php-dbg-component`. It downloads PHP from your site, so the
    runtime files are served with the page. Until php-dbg-wasm publishes a release with the
    debugger bridge, they come from this repository's `npm run setup:runtime`. Nothing is
    downloaded until a reader clicks Run or a script calls `run()` or `prepare()`.
  sections:
    guide:
      title: Guide
      weight: 0
    reference:
      title: Reference
      weight: 10
    optional:
      title: Optional
      weight: 100
