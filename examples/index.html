<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHP debugger example</title><link rel="stylesheet" href="../src/styles.css"><style>body{max-width:1100px;margin:2rem auto;padding:1rem;font-family:system-ui}textarea{width:100%;min-height:12rem}</style><h1>PHP debugger</h1><p>Run to pause on line 3. Edit $n, step, and inspect the result.</p><div id="debugger"></div><p><a href="../docs/">Documentation and demos</a></p><script type="module">import {PhpDebugger} from '../src/index.mjs';const dbg=new PhpDebugger({runtimeBaseUrl:'/runtime/',code:'<?php\n$n = 2;\n$n += 3;\necho "Result: $n\\n";',breakpoints:[3]});dbg.mount(document.querySelector('#debugger'));window.debuggerExample=dbg;</script></html>
