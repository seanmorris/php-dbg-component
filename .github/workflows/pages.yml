name: Publish documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUNTIME_BUNDLE: ${{ github.workspace }}/runtime-bundle
      PHP_VERSION: '8.4'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test && npm run test:types
      - run: node scripts/download-runtime.mjs
      # SMGen, which builds the site, needs PHP with the YAML extension on the runner, and
      # Pandoc. This PHP is the build tool's; the PHP the site runs is in the runtime bundle.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: yaml
          coverage: none
      - run: sudo apt-get update && sudo apt-get install --yes pandoc
      # Tested as "npm start" serves it, under /docs.
      - run: npm run build:docs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      # Then built again for the path Pages serves it under, which is what gets published.
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build:docs
        env:
          DOCS_BASE_URL: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
